apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-2-42-deployment
  namespace: aswin-kl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: task-2-42
  template:
    metadata:
      labels:
        app: task-2-42
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: persistent-storage
              mountPath: /data
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: task-2-42-pvc
