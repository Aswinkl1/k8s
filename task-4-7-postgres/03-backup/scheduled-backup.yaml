apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: task-4-7-aswin-daily-backup
  namespace: aswin-kl
  labels:
    app.kubernetes.io/name: task-4-7-aswin-pg
spec:
  # Six-field cron (seconds first): every day at 02:00 UTC
  schedule: "0 0 2 * * *"
  # Take the first backup as soon as this is applied
  immediate: true
  backupOwnerReference: self
  cluster:
    name: task-4-7-aswin-pg
  # Run the backup on a replica so the primary is not loaded
  target: prefer-standby
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
