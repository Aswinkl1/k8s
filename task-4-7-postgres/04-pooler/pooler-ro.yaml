# Read endpoint: task-4-7-aswin-pooler-ro.aswin-kl.svc:5432 -> replicas only
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: task-4-7-aswin-pooler-ro
  namespace: aswin-kl
  labels:
    app.kubernetes.io/name: task-4-7-aswin-pooler-ro
spec:
  cluster:
    name: task-4-7-aswin-pg
  instances: 2
  type: ro

  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
      reserve_pool_size: "5"
      server_idle_timeout: "300"

  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-4-7-aswin-pooler-ro
        app.kubernetes.io/part-of: task-4-7
    spec:
      containers: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    cnpg.io/poolerName: task-4-7-aswin-pooler-ro
