# Write endpoint: task-4-7-aswin-pooler-rw.aswin-kl.svc:5432 -> primary only
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: task-4-7-aswin-pooler-rw
  namespace: aswin-kl
  labels:
    app.kubernetes.io/name: task-4-7-aswin-pooler-rw
spec:
  cluster:
    name: task-4-7-aswin-pg
  instances: 2
  type: rw

  pgbouncer:
    # A server connection is held only for the duration of a transaction,
    # so many clients share a small number of Postgres backends.
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
      reserve_pool_size: "5"
      server_idle_timeout: "300"

  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-4-7-aswin-pooler-rw
        app.kubernetes.io/part-of: task-4-7
    spec:
      containers: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    cnpg.io/poolerName: task-4-7-aswin-pooler-rw
