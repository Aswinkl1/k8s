# Picked up by the observability Prometheus (ruleSelector: {}, all namespaces).
# Responses for each alert: architecture.md, section "Monitoring and alerts".
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: task-4-7-aswin-pg-alerts
  namespace: aswin-kl
  labels:
    app.kubernetes.io/name: task-4-7-aswin-pg
    release: prometheus-stack
spec:
  groups:
    - name: task-4-7-aswin-pg.availability
      rules:
        - alert: Task47PostgresInstanceDown
          expr: |
            count(cnpg_collector_up{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"} == 1) < 3
            or
            absent(cnpg_collector_up{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"})
          for: 2m
          labels:
            severity: critical
            team: platform
            owner: aswin-kl
          annotations:
            summary: "task-4-7-aswin-pg has fewer than 3 healthy instances"
            description: "Fewer than 3 Postgres instances are reporting metrics for 2 minutes. HA is reduced; one more failure may cause downtime."

        - alert: Task47PostgresReplicasNotStreaming
          expr: |
            max(cnpg_pg_replication_streaming_replicas{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"}) < 2
          for: 5m
          labels:
            severity: warning
            team: platform
            owner: aswin-kl
          annotations:
            summary: "Primary has {{ $value }} streaming replicas (expected 2)"
            description: "A replica is not streaming WAL from the primary. Reads on that replica go stale and synchronous commit has less headroom."

        - alert: Task47PgBouncerDown
          expr: |
            sum(up{namespace="aswin-kl", pod=~"task-4-7-aswin-pooler-rw-.*"}) < 1
            or
            absent(up{namespace="aswin-kl", pod=~"task-4-7-aswin-pooler-rw-.*"})
          for: 2m
          labels:
            severity: critical
            team: platform
            owner: aswin-kl
          annotations:
            summary: "No healthy PgBouncer pod behind the write endpoint"
            description: "The application cannot write through task-4-7-aswin-pooler-rw."

    - name: task-4-7-aswin-pg.replication
      rules:
        - alert: Task47PostgresReplicationLagHigh
          expr: |
            max by (pod) (cnpg_pg_replication_lag{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"}) > 30
          for: 2m
          labels:
            severity: warning
            team: platform
            owner: aswin-kl
          annotations:
            summary: "Replica {{ $labels.pod }} is {{ $value | humanizeDuration }} behind the primary"
            description: "Reads served by this replica are stale. If the lag keeps growing the replica may need re-cloning."

        - alert: Task47PostgresReplicationLagCritical
          expr: |
            max by (pod) (cnpg_pg_replication_lag{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"}) > 300
          for: 5m
          labels:
            severity: critical
            team: platform
            owner: aswin-kl
          annotations:
            summary: "Replica {{ $labels.pod }} is more than 5 minutes behind"
            description: "Replica is effectively unusable for reads and as a failover target."

    - name: task-4-7-aswin-pg.storage
      rules:
        - alert: Task47PostgresDiskFillingUp
          expr: |
            kubelet_volume_stats_available_bytes{namespace="aswin-kl", persistentvolumeclaim=~"task-4-7-aswin-pg-[0-9]+"}
              /
            kubelet_volume_stats_capacity_bytes{namespace="aswin-kl", persistentvolumeclaim=~"task-4-7-aswin-pg-[0-9]+"}
              < 0.20
          for: 5m
          labels:
            severity: warning
            team: platform
            owner: aswin-kl
          annotations:
            summary: "Volume {{ $labels.persistentvolumeclaim }} has less than 20% free"
            description: "Postgres stops accepting writes when the data volume is full. Expand the PVC via spec.storage.size."

        - alert: Task47PostgresDiskWillFillIn6h
          expr: |
            predict_linear(kubelet_volume_stats_available_bytes{namespace="aswin-kl", persistentvolumeclaim=~"task-4-7-aswin-pg-[0-9]+"}[1h], 6 * 3600) < 0
          for: 15m
          labels:
            severity: critical
            team: platform
            owner: aswin-kl
          annotations:
            summary: "Volume {{ $labels.persistentvolumeclaim }} will be full within 6 hours"
            description: "At the current growth rate the data volume fills up in under 6 hours. Usually a stuck WAL archive or a runaway write."

        - alert: Task47PostgresConnectionsNearMax
          expr: |
            sum by (pod) (cnpg_backends_total{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"})
              /
            max by (pod) (cnpg_pg_settings_setting{name="max_connections", namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"})
              > 0.8
          for: 5m
          labels:
            severity: warning
            team: platform
            owner: aswin-kl
          annotations:
            summary: "{{ $labels.pod }} is using more than 80% of max_connections"
            description: "Something is bypassing PgBouncer or the pool size is too large."

        - alert: Task47PgBouncerClientsWaiting
          expr: |
            max by (pod) (cnpg_pgbouncer_pools_cl_waiting{namespace="aswin-kl"}) > 0
          for: 2m
          labels:
            severity: warning
            team: platform
            owner: aswin-kl
          annotations:
            summary: "Clients are queueing in {{ $labels.pod }}"
            description: "All server connections in the pool are busy. Queries are slow or the pool is too small."

    - name: task-4-7-aswin-pg.backups
      rules:
        - alert: Task47PostgresWALArchivingFailing
          expr: |
            increase(cnpg_pg_stat_archiver_failed_count{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"}[5m]) > 0
          for: 5m
          labels:
            severity: critical
            team: platform
            owner: aswin-kl
          annotations:
            summary: "WAL archiving to object storage is failing on {{ $labels.pod }}"
            description: "Point-in-time recovery is not possible past the last archived WAL, and unarchived WAL piles up on the disk."

        - alert: Task47PostgresWALArchivingStale
          expr: |
            (max by (pod) (cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"}) > 900)
              and on (pod)
            (cnpg_pg_replication_in_recovery{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"} == 0)
          for: 5m
          labels:
            severity: warning
            team: platform
            owner: aswin-kl
          annotations:
            summary: "No WAL archived from the primary for over 15 minutes"
            description: "archive_timeout is 5 minutes, so a WAL file should be archived at least that often."

        - alert: Task47PostgresBackupTooOld
          expr: |
            time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"}) > 26 * 3600
          for: 10m
          labels:
            severity: critical
            team: platform
            owner: aswin-kl
          annotations:
            summary: "Last successful base backup is older than 26 hours"
            description: "The daily ScheduledBackup has not succeeded. Restores would need to replay a lot of WAL, or may not be possible."

        - alert: Task47PostgresBackupFailed
          expr: |
            max(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"})
              >
            max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"})
          for: 5m
          labels:
            severity: critical
            team: platform
            owner: aswin-kl
          annotations:
            summary: "The most recent base backup failed"
            description: "Check kubectl get backups -n aswin-kl and the plugin-barman-cloud sidecar logs."

        - alert: Task47PostgresBackupMetricsMissing
          expr: |
            absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="aswin-kl", pod=~"task-4-7-aswin-pg-[0-9]+"})
          for: 30m
          labels:
            severity: warning
            team: platform
            owner: aswin-kl
          annotations:
            summary: "No backup metrics for task-4-7-aswin-pg"
            description: "Either no backup has ever completed or the Barman Cloud plugin is not reporting. The backup alerts above cannot fire until this is fixed."
