# Picked up by the observability Prometheus (podMonitorSelector: {}, all namespaces)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: task-4-7-aswin-pg
  namespace: aswin-kl
  labels:
    app.kubernetes.io/name: task-4-7-aswin-pg
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: task-4-7-aswin-pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: task-4-7-aswin-pg-poolers
  namespace: aswin-kl
  labels:
    app.kubernetes.io/name: task-4-7-aswin-pg
    release: prometheus-stack
spec:
  selector:
    matchExpressions:
      - key: cnpg.io/poolerName
        operator: In
        values:
          - task-4-7-aswin-pooler-rw
          - task-4-7-aswin-pooler-ro
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
