apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: task-2-51-aswin-cluster-issuer
spec:
  acme:
    email: kl.aswinkl@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory

    privateKeySecretRef:
      name: task-2-51-aswin-acme-account-key

    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: task-2-51-aswin-cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - aswinkl.online
