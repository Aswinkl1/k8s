apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-2-41-ingress
  namespace: aswin-kl
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - task-2-41.example.aswin.com
      secretName: task-2-41-tls

  rules:
    - host: task-2-41.example.aswin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-2-41-svc
                port:
                  number: 80
