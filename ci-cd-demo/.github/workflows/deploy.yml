name: Build, Push & Deploy to ECS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "terraform/**"
      - "**.md"
  workflow_dispatch:

# Serialise deploys so two pushes never race on the same :latest tag / service.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # request the GitHub OIDC JWT
  contents: read # actions/checkout

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: task-3-49-cluster
  ECS_SERVICE: task-3-49-service
  IMAGE_NAME: task-3-49-flask

jobs:
  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Do not add `environment:` here: it changes the OIDC `sub` claim to
    # repo:<owner>/<repo>:environment:<name>, which the branch-scoped trust policy rejects.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --query 'service.deployments[0].{id:id,status:status,rollout:rolloutState}' \
            --output table

      - name: Wait for service to become stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{running:runningCount,desired:desiredCount,deployments:length(deployments)}' \
            --output table
