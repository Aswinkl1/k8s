apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-2-44-deployment
  namespace: aswin-kl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-2-44
  template:
    metadata:
      labels:
        app: task-2-44
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
